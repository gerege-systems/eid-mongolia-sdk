# TEMPORARY (PR #87): record test/fixtures/pades/seal with the Go reference SealPDF at the pinned Go commit (and its
# parent, as a fidelity check against the current fixture). Removed before merge.
name: tmp-seal-record
on: pull_request
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gerege-systems/eid-mongolia-sdk-go
          ref: d5a68ae90582609e3aea8ae8afe4dc0b6bf8093d
          fetch-depth: 2
          path: gosdk
      - uses: actions/setup-go@v5
        with:
          go-version-file: gosdk/go.mod
      - name: record at d5a68ae (pinned)
        working-directory: gosdk
        env:
          SEAL_DIR: ${{ github.workspace }}/test/fixtures/pades/seal
          GOLDEN_DIR: ${{ github.workspace }}/test/fixtures/pades/golden
        run: |
          git log -1 --format='%H %s'
          cp ../.github/tmp-seal-record/zz_tmp_seal_record_test.go pades/
          go test ./pades -run TestTmpSealRecord -count=1 -v
      - name: record at parent (fidelity check)
        continue-on-error: true
        working-directory: gosdk
        env:
          SEAL_DIR: ${{ github.workspace }}/test/fixtures/pades/seal
          GOLDEN_DIR: ${{ github.workspace }}/test/fixtures/pades/golden
        run: |
          rm -f pades/zz_tmp_seal_record_test.go
          git checkout -q HEAD~1
          git log -1 --format='%H %s'
          cp ../.github/tmp-seal-record/zz_tmp_seal_record_test.go pades/
          go test ./pades -run TestTmpSealRecord -count=1 -v
