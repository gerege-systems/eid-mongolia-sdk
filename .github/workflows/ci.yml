name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  changelog:
    # PR бүр changelog.d/ фрагменттай (эсвэл release нэгтгэл) — changelog.d/README.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/changelog.mjs check-pr "${{ github.event.pull_request.base.sha }}"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # /pades conformance: test/fixtures/pades/golden + src/pades/assets нь бэхэлсэн Go reference commit-тэй байт-ижил
      # (scripts/sync-pades-golden.mjs-ийн GO_SDK_COMMIT).
      - name: pades golden ↔ Go reference
        run: npm run golden:check
      - run: npm test
      - name: pades browser bundle ≤ 300 KB gzip
        run: npm run size:pades
      - name: Багцын хэмжээ
        run: npm pack --dry-run 2>&1 | tail -8
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
  node-compat:
    # Бүх багц (үндсэн entry, /browser, /button, /pades) — package.json engines (Node ≥ 18): `npm test`-ийн тестүүдийг
    # type stripping-гүй хувилбараар (scripts/test-compat.mjs) test job-ийн dist дээр + /pades ESM/CJS smoke.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node scripts/test-compat.mjs
      - run: node test/pades-node18.mjs
  convert-e2e:
    # /convert: жинхэнэ LibreOffice WASM хөтөчид (COOP/COEP + хатуу CSP) → PDF → /pades prepare; кэш, цуцлалт.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps ${{ matrix.browser == 'chromium' && '--only-shell chromium' || 'webkit' }}
      - run: node scripts/convert-e2e.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          # brotli 11 soffice.wasm-д ~4+ мин; .br-ийн зөв эсэхэд чанар нөлөөлөхгүй.
          EID_CONVERT_BROTLI_QUALITY: 9
