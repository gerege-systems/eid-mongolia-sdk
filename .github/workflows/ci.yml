name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # /pades conformance: test/fixtures/pades/golden + src/pades/assets нь бэхэлсэн Go reference commit-тэй байт-ижил
      # (scripts/sync-pades-golden.mjs-ийн GO_SDK_COMMIT).
      - name: pades golden ↔ Go reference
        run: npm run golden:check
      - run: npm test
      - name: pades browser bundle ≤ 300 KB gzip
        run: npm run size:pades
      - name: Багцын хэмжээ
        run: npm pack --dry-run 2>&1 | tail -8
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
  pades-node18:
    # /pades нь Node ≥ 18-д ажиллана (global crypto үгүй) — test job-ийн dist-ээр, golden-ийн 2 тохиолдол бүтэн.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: node test/pades-node18.mjs
